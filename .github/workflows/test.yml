name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  # main.yml runs the tests before it builds and publishes a release.
  workflow_call:

jobs:
  test:
    # Docker is preinstalled on ubuntu runners; the integration and E2E tests start their containers via Testcontainers.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported PowerDNS major version; the E2E tests run against each.
        # Pinned like all test images (PowerDnsStack.cs, RqliteFixture.cs, tests/docker/docker-compose.yml).
        pdns-image:
          - powerdns/pdns-auth-49:4.9.17
          - powerdns/pdns-auth-51:5.1.5
    name: test (${{ matrix.pdns-image }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        env:
          PDNS_IMAGE: ${{ matrix.pdns-image }}
        run: dotnet test tests/PowerRqlite.Tests --logger "console;verbosity=normal"
