name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Docker is preinstalled on ubuntu runners; the integration and E2E tests start their containers via Testcontainers.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported PowerDNS major version; the E2E tests run against each.
        pdns-image:
          - powerdns/pdns-auth-49:latest
          - powerdns/pdns-auth-51:5.1.4
    name: test (${{ matrix.pdns-image }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        env:
          PDNS_IMAGE: ${{ matrix.pdns-image }}
        run: dotnet test tests/PowerRqlite.Tests --logger "console;verbosity=normal"
