name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Docker is preinstalled on ubuntu runners; the integration and E2E tests start their containers via Testcontainers.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/PowerRqlite.Tests --logger "console;verbosity=normal"
