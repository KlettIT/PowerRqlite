# PowerDNS test configuration, shared by tests/docker/docker-compose.yml and the E2E tests.
# Test setup only: DNS UPDATE and the Web API are open to everyone and all caches are off.
launch=remote
remote-connection-string=http:url=http://powerrqlite:8080/PowerDns,timeout=20000
local-address=0.0.0.0
security-poll-suffix=

dnsupdate=yes
allow-dnsupdate-from=0.0.0.0/0,::/0

# Web API (the E2E tests edit zones through it). Test key only.
api=yes
api-key=powerrqlite-test
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0,::/0

# No caches, so a write is visible to the next query immediately.
cache-ttl=0
negquery-cache-ttl=0
query-cache-ttl=0
zone-cache-refresh-interval=0

# The E2E tests drop an override for remote-connection-string in here.
include-dir=/etc/powerdns/pdns.d
