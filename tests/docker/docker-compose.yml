# Manual test stack: the same PowerDNS setup the E2E tests in tests/PowerRqlite.Tests run.
#
#   docker compose -f tests/docker/docker-compose.yml up --build
#
#   PowerDNS 5.1 by default; PDNS_IMAGE=powerdns/pdns-auth-49:4.9.17 for 4.9.
#
#   docker compose -f tests/docker/docker-compose.yml exec powerdns pdnsutil backend-cmd remote "create-zone example.test ns1.example.test"
#   docker compose -f tests/docker/docker-compose.yml exec powerdns pdnsutil add-record example.test www.example.test A 300 192.0.2.1
#   dig @127.0.0.1 -p 1053 www.example.test A
#   nsupdate  (server 127.0.0.1 1053)

services:
  rqlite:
    image: rqlite/rqlite:10.6.2
    ports:
      - "127.0.0.1:4001:4001"

  powerrqlite:
    build: ../../src
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RqliteOptions__Url: http://rqlite:4001
    ports:
      - "127.0.0.1:5000:8080"
    depends_on:
      - rqlite

  powerdns:
    image: ${PDNS_IMAGE:-powerdns/pdns-auth-51:5.1.4}
    volumes:
      - ./powerdns/pdns.conf:/etc/powerdns/pdns.conf:ro
    ports:
      - "127.0.0.1:1053:53/udp"
      - "127.0.0.1:1053:53/tcp"
      - "127.0.0.1:8081:8081"
    depends_on:
      - powerrqlite
